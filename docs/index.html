<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Odyssey">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Odyssey</title>
<meta name="theme-color" content="#0A0F16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one phone column, sticky header, fixed bottom tab bar; sheets slide up from the bottom.
   Direction: night sea. Navy ink surfaces, brass for navigation/accent, green/red only for money. */
:root {
  --ink-0: #0A0F16;      /* page */
  --ink-1: #111823;      /* cards */
  --ink-2: #18212E;      /* inputs, raised */
  --line: #243041;
  --fg: #E7ECF3;
  --muted: #8E9BAE;
  --faint: #5F6C80;
  --brass: #D4A85A;      /* accent */
  --brass-ink: #1B1407;
  --gain: #46D39A;       /* profit / buy */
  --loss: #F0706A;       /* loss / skip */
  --watch: #8DB0F0;      /* maybe */
  --seg-cost: #4E7FD1;   /* chart: paid + costs */
  --seg-fee: #C47F2E;    /* chart: fees + tax */
  --seg-profit: #2BA571; /* chart: profit */
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
  --tabbar: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--ink-0); color: var(--fg); }
body { margin: 0; font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brass); }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 6px; }

.app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--ink-0) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); margin: 0 -16px; padding: 12px 16px 10px;
  display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand h1 { margin: 0; font: italic 400 30px/1 var(--font-display); letter-spacing: 0.01em; color: var(--fg); }
.top .status { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; line-height: 1.3; }
.icon-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line);
  background: var(--ink-1); cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; }

/* tabs */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--ink-1); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { display: grid; justify-items: center; gap: 2px; padding: 6px 0; border: 0; background: none; color: var(--faint);
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em; border-radius: 10px; cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--brass); }
.tab[aria-selected="true"] svg { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--brass) 45%, transparent)); }

section.view { display: grid; gap: 16px; padding-top: 16px; }
.view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.view-head h2 { margin: 0; font: 400 34px/1.05 var(--font-display); text-wrap: balance; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

.banner { border: 1px dashed color-mix(in srgb, var(--brass) 55%, transparent); border-radius: var(--r); padding: 10px 12px;
  font-size: 13.5px; color: var(--muted); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner b { color: var(--brass); font-weight: 600; }

/* chips / segmented */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--ink-1); color: var(--muted); border-radius: 999px; padding: 6px 12px;
  font-size: 13px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; border: 1px solid var(--line); background: var(--ink-2); border-radius: 10px; padding: 7px 11px; font-size: 13px;
  font-weight: 600; color: var(--muted); cursor: pointer; }
.seg input:checked + span { border-color: var(--brass); color: var(--fg); background: color-mix(in srgb, var(--brass) 16%, var(--ink-2)); }
.seg input:focus-visible + span { outline: 2px solid var(--brass); outline-offset: 2px; }

/* verdict pill */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px 3px 8px; font-size: 11.5px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.buy { color: var(--gain); background: color-mix(in srgb, var(--gain) 14%, transparent); }
.pill.maybe { color: var(--watch); background: color-mix(in srgb, var(--watch) 14%, transparent); }
.pill.skip { color: var(--loss); background: color-mix(in srgb, var(--loss) 14%, transparent); }
.pill.neutral { color: var(--muted); background: var(--ink-2); }
.tag { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }

/* deal cards */
.list { display: grid; gap: 10px; }
.deal { display: grid; gap: 10px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--ink-1); border-radius: var(--r);
  padding: 14px; cursor: pointer; position: relative; overflow: hidden; }
.deal::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--stripe, var(--line)); }
.deal.buy { --stripe: var(--gain); }
.deal.maybe { --stripe: var(--watch); }
.deal.skip { --stripe: var(--loss); }
.deal:active { transform: scale(0.995); }
.deal .row1 { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.deal .title { font-weight: 600; font-size: 15px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.deal .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.fig { display: grid; gap: 1px; min-width: 0; }
.fig .k { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.03em; }
.fig .v { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pos { color: var(--gain); }
.neg { color: var(--loss); }

/* forms */
.panel { border: 1px solid var(--line); background: var(--ink-1); border-radius: var(--r); padding: 14px; display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span, .field-label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field small { color: var(--faint); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
input[type="number"] { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
textarea { min-height: 120px; font-family: var(--font-data); font-size: 12px; resize: vertical; }
.money { position: relative; }
.money input { padding-right: 48px; }
.money::after { content: attr(data-unit); position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 12px; font-weight: 600; pointer-events: none; }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--brass); }
.hint { font-size: 12.5px; color: var(--muted); }
.match { font-size: 12.5px; color: var(--gain); }
.match.none { color: var(--faint); }

.btn { border: 1px solid var(--line); background: var(--ink-2); border-radius: 12px; padding: 11px 14px; font-weight: 700; font-size: 14px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--loss); }
.btn.small { padding: 6px 10px; min-height: 34px; font-size: 12.5px; border-radius: 10px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 auto; }

/* result */
.result { border: 1px solid var(--line); border-radius: var(--r); background: var(--ink-1); overflow: hidden; }
.result-head { padding: 16px; display: grid; gap: 6px; background: linear-gradient(180deg, color-mix(in srgb, var(--hero, var(--line)) 10%, transparent), transparent); }
.result-head.buy { --hero: var(--gain); } .result-head.maybe { --hero: var(--watch); } .result-head.skip { --hero: var(--loss); }
.hero-num { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 40px; line-height: 1.05; font-weight: 500; letter-spacing: -0.03em; }
.hero-num small { font-size: 16px; color: var(--muted); font-weight: 400; margin-left: 4px; letter-spacing: 0; }
.hero-sub { font-size: 13.5px; color: var(--muted); }
.hero-sub b { color: var(--fg); font-weight: 600; }
.bar { display: flex; height: 14px; gap: 2px; margin: 4px 0 2px; }
.bar i { display: block; height: 100%; min-width: 2px; }
.bar i:first-child { border-radius: 4px 0 0 4px; } .bar i:last-child { border-radius: 0 4px 4px 0; } .bar i:only-child { border-radius: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend span::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--c); }
.ledger { display: grid; padding: 4px 16px 8px; }
.ledger .ln { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.ledger .ln:last-child { border-bottom: 0; }
.ledger .ln .lbl { color: var(--muted); min-width: 0; }
.ledger .ln .lbl small { display: block; color: var(--faint); font-size: 11.5px; }
.ledger .ln .amt { font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; }
.ledger .ln.total { border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); font-weight: 600; }
.ledger .ln.total .lbl { color: var(--fg); }
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.metric { background: var(--ink-1); padding: 12px 16px; display: grid; gap: 2px; min-width: 0; }
.metric .k { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.metric .v { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 18px; }
.metric .s { font-size: 11.5px; color: var(--faint); }
.warn { font-size: 12.5px; color: var(--brass); padding: 10px 16px; border-top: 1px solid var(--line); }

/* stock */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); background: var(--ink-1); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi .k { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.kpi .v { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.wide { grid-column: 1 / -1; }
.kpi.wide .v { font-size: 30px; }
.group-title { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.item { border: 1px solid var(--line); background: var(--ink-1); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; }
.item .row1 { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.item .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.item .sub { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--loss); }

.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px 16px; display: grid; gap: 10px; justify-items: start; color: var(--muted); }
.empty h3 { margin: 0; font: 400 24px/1.15 var(--font-display); color: var(--fg); }

/* chart */
.chart { border: 1px solid var(--line); background: var(--ink-1); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
  font-size: 12px; white-space: nowrap; transform: translate(-50%, -110%); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--ink-1); }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
td.n, th.n { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(3, 6, 10, 0.66); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--ink-0); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 20px 20px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px;
  animation: up 0.22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: 0.6; } }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 0; }
.sheet-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.sheet-head h3 { margin: 0; font: 400 26px/1.15 var(--font-display); text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30;
  background: var(--fg); color: var(--ink-0); font-weight: 700; font-size: 13.5px; padding: 9px 14px; border-radius: 999px; }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } * { scroll-behavior: auto; } }
@media (max-width: 380px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hero-num { font-size: 34px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#111823"/><path d="M262 118 C 330 170 368 250 372 330 L 262 330 Z" fill="#D4A85A"/><path d="M246 168 L 246 330 L 150 330 C 168 268 198 214 246 168 Z" fill="#D4A85A" opacity="0.55"/><rect x="249" y="108" width="10" height="236" rx="5" fill="#E7ECF3"/><path d="M132 372 C 172 354 212 354 256 372 C 300 390 340 390 380 372" fill="none" stroke="#46D39A" stroke-width="18" stroke-linecap="round"/></svg>
      <h1>Odyssey</h1>
    </div>
    <div class="status" id="status">Loading…</div>
    <button class="icon-btn" id="open-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </button>
  </header>

  <!-- DEALS -->
  <section class="view" id="view-deals" aria-labelledby="t-deals">
    <div class="view-head">
      <h2>Deals</h2>
      <button class="btn small ghost" id="refresh">Refresh</button>
    </div>
    <div class="banner" id="deals-sample" hidden><span><b>Example deals.</b> Real ones appear here after your first scan.</span></div>
    <div class="chips" role="group" aria-label="Filter deals">
      <button class="chip" data-filter="buy" aria-pressed="true">Buy</button>
      <button class="chip" data-filter="maybe" aria-pressed="false">Watch</button>
      <button class="chip" data-filter="all" aria-pressed="false">All</button>
      <button class="chip" data-sort="profit" aria-pressed="false" style="margin-left:auto">Top profit</button>
    </div>
    <div class="list" id="deal-list"></div>
  </section>

  <!-- CALCULATOR -->
  <section class="view" id="view-calc" hidden>
    <div class="view-head"><h2>Profit check</h2><span class="eyebrow">Before you buy</span></div>
    <form class="panel" id="calc-form" autocomplete="off">
      <label class="field"><span>Listing title <small>(paste it, Odyssey finds the item type)</small></span>
        <input type="text" id="calc-title" placeholder="e.g. Holmegaard gulvvase grøn 45 cm"></label>
      <div class="match none" id="calc-match">No item matched yet. Pick one below.</div>
      <label class="field"><span>Item type</span><select id="calc-ref"></select></label>
      <div class="grid2">
        <label class="field"><span>Asking price</span><div class="money" data-unit="DKK" id="calc-price-wrap"><input type="number" inputmode="decimal" id="calc-price" min="0" step="1" value="1000"></div></label>
        <label class="field"><span>Currency</span><select id="calc-currency"></select></label>
      </div>
      <label class="field"><span>Typical sale price, good condition</span><div class="money" data-unit="DKK"><input type="number" inputmode="decimal" id="calc-resale" min="0" step="10"></div>
        <small id="calc-resale-src"></small></label>
      <div class="field"><span class="field-label">Condition</span><div class="seg" id="calc-condition"></div></div>
      <div class="field"><span class="field-label">Sell on</span><div class="seg" id="calc-platform"></div></div>
      <div class="grid3">
        <label class="field"><span>Pickup</span><div class="money" data-unit="kr"><input type="number" inputmode="decimal" id="calc-transport" min="0"></div></label>
        <label class="field"><span>Cleaning</span><div class="money" data-unit="kr"><input type="number" inputmode="decimal" id="calc-cleaning" min="0"></div></label>
        <label class="field"><span>Other</span><div class="money" data-unit="kr"><input type="number" inputmode="decimal" id="calc-extra" min="0" value="0"></div></label>
      </div>
      <label class="check"><input type="checkbox" id="calc-ship"> I'll ship it to the buyer (adds packing)</label>
    </form>
    <div id="calc-result"></div>
    <div class="btn-row"><button class="btn primary" id="calc-add">Add to my stock</button></div>
  </section>

  <!-- STOCK -->
  <section class="view" id="view-stock" hidden>
    <div class="view-head"><h2>My stock</h2><button class="btn small primary" id="stock-add">Add item</button></div>
    <div id="stock-body"></div>
  </section>

  <!-- STATS -->
  <section class="view" id="view-stats" hidden>
    <div class="view-head"><h2>Stats</h2><span class="eyebrow">After tax</span></div>
    <div id="stats-body"></div>
  </section>
</div>

<div class="tabbar"><nav role="tablist" aria-label="Sections">
  <button class="tab" role="tab" data-tab="deals" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Deals</button>
  <button class="tab" role="tab" data-tab="calc" aria-selected="false">

<script>
"use strict";
/* ------------------------------------------------------------------ storage */
const store = {
  get(k, d) { try { const v = localStorage.getItem("odyssey." + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("odyssey." + k, JSON.stringify(v)); return true; } catch { return false; } },
};
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const kr = (n, sign = false) => {
  if (n == null || !isFinite(n)) return "–";
  const s = Math.round(Math.abs(n)).toLocaleString("da-DK");
  return (n < 0 ? "−" : sign && n > 0 ? "+" : "") + s;
};
const pct = n => isFinite(n) ? Math.round(n * 100) + "%" : "–";
const today = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 864e5));
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const uid = () => Math.random().toString(36).slice(2, 10);
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 6e4);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + " h ago";
  return Math.round(h / 24) + " d ago";
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
const readJSON = id => { try { return JSON.parse($("#" + id).textContent); } catch { return null; } };

/* ------------------------------------------------------------------ state */
const S = {
  base: readJSON("fallback-settings"),
  refs: readJSON("fallback-refs") || [],
  deals: readJSON("fallback-deals") || { items: [], sample: true },
  stock: store.get("stock", []),
  overrides: store.get("settings", {}),
  filter: "buy", sortProfit: false,
};
function settings() {
  const b = S.base, o = S.overrides || {};
  const s = JSON.parse(JSON.stringify(b));
  for (const k of ["tax_rate", "min_profit_after_tax", "max_buy_ratio", "max_price_dkk", "hours_per_item", "default_platform", "ship_by_default"]) if (o[k] != null) s[k] = o[k];
  if (o.costs) Object.assign(s.costs, o.costs);
  if (o.fees) for (const [p, f] of Object.entries(o.fees)) if (s.platforms[p]) s.platforms[p].fee_pct = f;
  return s;
}
const refById = id => S.refs.find(r => r.id === id);

/* ------------------------------------------------------------------ matching (mirrors scanner.py) */
function norm(t) {
  t = String(t).toLowerCase();
  for (const [a, b] of [["æ", "ae"], ["ø", "o"], ["å", "a"], ["ä", "a"], ["ö", "o"], ["ü", "u"], ["ß", "ss"]]) t = t.split(a).join(b);
  return t.normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
}
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const hasWord = (text, phrase) => { phrase = norm(phrase); return !!phrase && new RegExp("(?<![a-z0-9])" + reEsc(phrase) + "(?![a-z0-9])").test(text); };
const GLOBAL_EXCLUDE = ["kopi", "replika", "replica", "copy", "reproduktion", "reproduction", "inspireret", "inspired", "i stil med", "style", "a la", "look alike", "lignende", "defekt", "skar", "beskadiget", "damaged", "broken", "limet", "glued", "reservedel", "spare part", "plakat", "poster", "bog", "book"];
function matchRef(title) {
  const t = norm(title);
  if (!t) return { ref: null };
  const bad = GLOBAL_EXCLUDE.find(w => hasWord(t, w));
  if (bad) return { ref: null, excluded: bad };
  const c = S.refs.filter(r => !(r.exclude || []).some(w => hasWord(t, w)) && r.keywords.every(g => g.some(a => hasWord(t, a))));
  c.sort((a, b) => (b.keywords.length - a.keywords.length) || (b.resale_dkk - a.resale_dkk));
  return { ref: c[0] || null };
}

/* ------------------------------------------------------------------ learning from your own sales */
function learned(refId) {
  const sold = S.stock.filter(i => i.status === "sold" && !i.example && i.ref_id === refId && i.sold_price > 0);
  if (sold.length < 2) return null;
  return { resale: median(sold.map(i => i.sold_price)), days: median(sold.map(i => daysBetween(i.bought_date, i.sold_date))) || null, n: sold.length };
}

/* ------------------------------------------------------------------ finance (mirrors scanner/finance.py) */
function computeDeal(resale, refDays, asking, s, o = {}) {
  const p = s.platforms[o.platform || s.default_platform];
  const cond = s.conditions[o.condition || s.default_condition].factor;
  const ship = o.ship == null ? s.ship_by_default : o.ship;
  const transport = o.transport == null ? s.costs.transport : o.transport;
  const cleaning = o.cleaning == null ? s.costs.cleaning : o.cleaning;
  const packing = ship ? s.costs.packing : 0;
  const extra = o.extra || 0;
  const t = s.tax_rate;
  const sell = resale * cond;
  const fee = sell * p.fee_pct + (sell > 0 ? p.fee_fixed : 0);
  const direct = transport + cleaning + packing + extra;
  const invested = asking + direct;
  const before_tax = sell - fee - invested;
  const tax = Math.max(0, before_tax) * t;
  const after_tax = before_tax - tax;
  let days, days_source;
  if (o.learnedDays) { days = o.learnedDays; days_source = "your sales"; }
  else if (p.fixed_days) { days = p.fixed_days; days_source = "auction cycle"; }
  else { days = refDays * p.days_factor; days_source = "estimate"; }
  const max_buy = Math.max(0, Math.min(sell - fee - direct - s.min_profit_after_tax / (1 - t), sell * s.max_buy_ratio));
  let verdict;
  if (asking > s.max_price_dkk) verdict = "skip";
  else if (after_tax >= s.min_profit_after_tax && asking <= max_buy + 0.5) verdict = "buy";
  else if (after_tax > 0) verdict = "maybe";
  else verdict = "skip";
  return { sell, fee, transport, cleaning, packing, extra, invested, before_tax, tax, after_tax,
    margin: sell ? after_tax / sell : 0, roi: invested ? after_tax / invested : 0, days, days_source,
    per_hour: s.hours_per_item ? after_tax / s.hours_per_item : 0, max_buy, verdict };
}
const VERDICT_LABEL = { buy: "Buy", maybe: "Watch", skip: "Skip" };

function dealFinance(d, s) {
  const ref = refById(d.ref_id);
  if (!ref) return null;
  const L = learned(ref.id);
  return { ref, L, f: computeDeal(L ? L.resale : ref.resale_dkk, ref.days_to_sell, d.price_dkk, s, { extra: d.extra_cost_dkk || 0, learnedDays: L && L.days }) };
}

      <div class="hero-sub">Pay at most <b class="num">${kr(f.max_buy)} kr</b> to clear your ${kr(s.min_profit_after_tax)} kr target.</div>
      ${loss}
      <div class="bar" role="img" aria-label="Of the ${kr(f.sell)} kr sale: ${kr(f.invested)} paid and costs, ${kr(f.fee + f.tax)} fees and tax, ${kr(Math.max(0, f.after_tax))} profit">${bar}</div>
      <div class="legend">${segs.map(([l, v, c]) => `<span style="--c:${c}">${l} <b class="num">${kr(v)}</b></span>`).join("")}</div>
    </div>
    <div class="ledger">
      ${ln("Expected sale", kr(f.sell), opts.saleNote || "")}
      ${ln(`${pname} fee`, kr(-f.fee), f.fee ? "" : "No seller fee assumed")}
      ${ln("Price you pay", kr(-(f.invested - f.transport - f.cleaning - f.packing - f.extra)))}
      ${ln("Pickup transport", kr(-f.transport))}
      ${ln("Cleaning, small repairs", kr(-f.cleaning))}
      ${f.packing ? ln("Packing", kr(-f.packing), "Buyer pays postage") : ""}
      ${f.extra ? ln("Other costs", kr(-f.extra), opts.extraNote || "") : ""}
      ${ln("Profit before tax", kr(f.before_tax), "", "total")}
      ${ln("Tax", kr(-f.tax), taxNote)}
      ${ln("Profit after tax", `<span class="${f.after_tax >= 0 ? "pos" : "neg"}">${kr(f.after_tax)}</span>`, "", "total")}
    </div>
    <div class="metrics">
      <div class="metric"><span class="k">Margin on sale</span><span class="v">${pct(f.margin)}</span><span class="s">after tax</span></div>
      <div class="metric"><span class="k">Return on money</span><span class="v">${pct(f.roi)}</span><span class="s">on ${kr(f.invested)} kr in</span></div>
      <div class="metric"><span class="k">Time to sell</span><span class="v">~${Math.round(f.days)} days</span><span class="s">${f.days_source}</span></div>
      <div class="metric"><span class="k">Per hour of work</span><span class="v">${kr(f.per_hour)} kr</span><span class="s">at ${s.hours_per_item} h per item</span></div>

}

const saveStock = () => { if (!store.set("stock", S.stock)) toast("Couldn't save on this device"); };
function itemProfit(i, s) {
  const costs = (i.costs || 0);
  const before = (i.sold_price || 0) - (i.fee_paid || 0) - (i.bought_price || 0) - costs;
  return { before, after: before - Math.max(0, before) * s.tax_rate };
}

function openItem(i = {}) {

    const it = { ...i, id: i.id || uid(), name: v("f-name").trim(), ref_id: v("f-ref") || null, bought_price: n("f-bought") || 0, costs: n("f-costs") || 0,

function renderStock() {

    <p class="hint" style="margin:0">Your stock lives on this phone only. Copy this text somewhere safe (a note, an email to yourself). To restore, paste it back and tap Restore.</p>
    <textarea id="backup-text">${esc(JSON.stringify(S.stock))}</textarea>
    <div class="btn-row"><button class="btn" id="backup-copy">Copy</button><button class="btn primary" id="backup-restore">Restore</button></div>`);
  $("#backup-copy").addEventListener("click", () => {
    const ta = $("#backup-text");
    navigator.clipboard?.writeText(ta.value).then(() => toast("Copied"), () => { ta.select(); toast("Selected. Copy it manually"); }) ?? (ta.select(), toast("Selected. Copy it manually"));
  });
  $("#backup-restore").addEventListener("click", () => {
    try { const v = JSON.parse($("#backup-text").value); if (!Array.isArray(v)) throw 0; S.stock = v; saveStock(); closeSheet(); renderStock(); renderStats(); toast("Restored"); }
    catch { toast("That text isn't a valid backup"); }
  });
}

/* ------------------------------------------------------------------ stats */
function renderStats() {
  const s = settings(), el = $("#stats-body");
  const sold = S.stock.filter(i => i.status === "sold" && i.sold_price != null);
  if (!sold.length) {
    el.innerHTML = `<div class="empty"><h3>Stats start with your first sale</h3><p style="margin:0">Log sales in Stock. Here you'll see profit after tax by month, how fast things sell, and which items earn you the most.</p>
      <button class="btn small" data-goto="stock">Go to Stock</button></div>`;
    return;
  }
  const rows = sold.map(i => ({ i, p: itemProfit(i, s), days: daysBetween(i.bought_date, i.sold_date) }));
  const total = rows.reduce((a, r) => a + r.p.after, 0);
  const revenue = rows.reduce((a, r) => a + r.i.sold_price, 0);
  const avgDays = median(rows.map(r => r.days));
  const month = today().slice(0, 7);
  const thisMonth = rows.filter(r => (r.i.sold_date || "").startsWith(month)).reduce((a, r) => a + r.p.after, 0);
  const hours = rows.length * s.hours_per_item;
  // last 6 months
  const months = [];
  for (let k = 5; k >= 0; k--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - k); months.push(d.toISOString().slice(0, 7)); }
  const byMonth = months.map(m => ({ m, v: rows.filter(r => (r.i.sold_date || "").startsWith(m)).reduce((a, r) => a + r.p.after, 0), n: rows.filter(r => (r.i.sold_date || "").startsWith(m)).length }));
  // by item type
  const groups = {};
  for (const r of rows) { const k = r.i.ref_id ? (refById(r.i.ref_id)?.name || r.i.ref_id) : "Other"; (groups[k] ||= []).push(r); }
  const byType = Object.entries(groups).map(([k, g]) => ({ k, n: g.length, profit: g.reduce((a, r) => a + r.p.after, 0), days: median(g.map(r => r.days)) })).sort((a, b) => b.profit - a.profit);
  el.innerHTML = `${S.stock.some(i => i.example) ? `<div class="banner"><span><b>Showing example items.</b> Clear them in Stock.</span></div>` : ""}
    <div class="kpis">
      <div class="kpi wide"><span class="k">Profit after tax, all time</span><span class="v ${total >= 0 ? "pos" : "neg"}">${kr(total)} kr</span></div>
      <div class="kpi"><span class="k">This month</span><span class="v">${kr(thisMonth)} kr</span></div>
      <div class="kpi"><span class="k">Items sold</span><span class="v">${rows.length}</span></div>
      <div class="kpi"><span class="k">Median days to sell</span><span class="v">${avgDays ?? "–"}</span></div>
      <div class="kpi"><span class="k">Margin on sales</span><span class="v">${pct(revenue ? total / revenue : 0)}</span></div>
      <div class="kpi"><span class="k">Per hour of work</span><span class="v">${kr(hours ? total / hours : 0)} kr</span></div>
      <div class="kpi"><span class="k">Avg profit per item</span><span class="v">${kr(total / rows.length)} kr</span></div>
    </div>
    ${monthChart(byMonth)}
    <div class="group-title"><span class="eyebrow">By item type</span></div>
    <div class="table-wrap"><table><thead><tr><th>Item</th><th class="n">Sold</th><th class="n">Profit</th><th class="n">Days</th></tr></thead>
      <tbody>${byType.map(t => `<tr><td style="white-space:normal">${esc(t.k)}</td><td class="n">${t.n}</td><td class="n ${t.profit >= 0 ? "pos" : "neg"}">${kr(t.profit)}</td><td class="n">${t.days ?? "–"}</td></tr>`).join("")}</tbody></table></div>`;
  bindChart();
}
function monthChart(data) {
  const W = 520, H = 200, pl = 44, pr = 8, pt = 12, pb = 28;
  const maxV = Math.max(0, ...data.map(d => d.v)), minV = Math.min(0, ...data.map(d => d.v));
  const step = niceStep((maxV - minV) / 3 || 100);
  const top = Math.ceil(maxV / step) * step || step, bot = Math.floor(minV / step) * step;
  const y = v => pt + (top - v) / (top - bot) * (H - pt - pb);
  const bw = (W - pl - pr) / data.length;
  const ticks = []; for (let v = bot; v <= top + 1e-9; v += step) ticks.push(v);
  const label = m => new Date(m + "-01").toLocaleDateString("en-GB", { month: "short" });
  const bars = data.map((d, i) => {
    const x = pl + i * bw + bw * 0.22, w = bw * 0.56, y0 = y(0), y1 = y(d.v);
    const h = Math.max(Math.abs(y1 - y0), d.v ? 2 : 0), yy = d.v >= 0 ? y0 - h : y0;
    const r = Math.min(4, w / 2, h);
    const path = d.v >= 0
      ? `M${x},${y0} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + w - r} Q${x + w},${yy} ${x + w},${yy + r} V${y0} Z`
      : `M${x},${y0} V${yy + h - r} Q${x},${yy + h} ${x + r},${yy + h} H${x + w - r} Q${x + w},${yy + h} ${x + w},${yy + h - r} V${y0} Z`;
    return `<g class="mbar" data-tip="${label(d.m)}: ${kr(d.v)} kr · ${d.n} sold" data-x="${x + w / 2}" data-y="${Math.min(y0, yy)}">
      <rect x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent"/>
      ${h ? `<path d="${path}" fill="${d.v >= 0 ? "var(--seg-profit)" : "var(--loss)"}"/>` : ""}
      <text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${label(d.m)}</text></g>`;
  }).join("");
  return `<div class="chart" id="month-chart"><span class="eyebrow">Profit after tax by month</span>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Profit after tax for the last six months">
      ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v === 0 ? "" : 'stroke-dasharray="2 4"'}/>
        <text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--faint)" font-family="var(--font-data)">${kr(v)}</text>`).join("")}
      ${bars}
    </svg><div class="tip" hidden></div></div>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function bindChart() {
  const c = $("#month-chart"); if (!c) return;
  const tip = $(".tip", c), svg = $("svg", c);
  const show = g => {
    const r = svg.getBoundingClientRect(), cr = c.getBoundingClientRect(), k = r.width / 520;
    tip.textContent = g.dataset.tip; tip.hidden = false;
    tip.style.left = (r.left - cr.left + g.dataset.x * k) + "px"; tip.style.top = (r.top - cr.top + g.dataset.y * k - 4) + "px";
  };
  $$(".mbar", c).forEach(g => { g.addEventListener("pointerenter", () => show(g)); g.addEventListener("click", () => show(g)); });
  svg.addEventListener("pointerleave", () => tip.hidden = true);
}

/* ------------------------------------------------------------------ settings */
function openSettings() {
  const s = settings();
  const f = (id, label, val, unit, step = 1) => `<label class="field"><span>${label}</span><div class="money" data-unit="${unit}"><input type="number" inputmode="decimal" id="${id}" value="${val}" step="${step}"></div></label>`;
  openSheet(`<div class="sheet-head"><h3>Settings</h3><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <form class="panel" id="settings-form" style="border:0;padding:0;background:none">
      <span class="eyebrow">Your money rules</span>
      <div class="grid2">
        ${f("s-tax", "Your marginal tax rate", Math.round(s.tax_rate * 100), "%")}
        ${f("s-minprofit", "Min profit after tax", s.min_profit_after_tax, "kr")}
        ${f("s-ratio", "Max price vs sale price", Math.round(s.max_buy_ratio * 100), "%")}
        ${f("s-maxprice", "Never pay more than", s.max_price_dkk, "kr")}
        ${f("s-hours", "Your time per item", s.hours_per_item, "h", 0.25)}
      </div>
      <p class="hint" style="margin:0">Tax: profit from reselling items you bought to resell is taxable. Use your own marginal rate (check skat.dk). Selling your own used things is usually tax-free.</p>
      <span class="eyebrow">Usual costs per item</span>
      <div class="grid3">${f("s-transport", "Pickup", s.costs.transport, "kr")}${f("s-cleaning", "Cleaning", s.costs.cleaning, "kr")}${f("s-packing", "Packing", s.costs.packing, "kr")}</div>
      <span class="eyebrow">Seller fees</span>
      <div class="grid3">${Object.entries(s.platforms).map(([k, p]) => f("s-fee-" + k, p.label, Math.round(p.fee_pct * 1000) / 10, "%", 0.5)).join("")}</div>
      <p class="hint" style="margin:0">${S.base.fees_verified ? "" : "Fees are starting assumptions. Check each site's current seller fees and correct them here."}</p>
      <label class="field"><span>Where you usually sell</span><select id="s-platform">${Object.entries(s.platforms).map(([k, p]) => `<option value="${k}" ${k === s.default_platform ? "selected" : ""}>${p.label}</option>`).join("")}</select></label>
      <label class="check"><input type="checkbox" id="s-ship" ${s.ship_by_default ? "checked" : ""}> I usually ship items</label>
      <div class="btn-row"><button class="btn primary" type="submit">Save</button><button class="btn ghost" type="button" id="s-reset">Reset to defaults</button></div>
      <p class="hint" style="margin:0">These apply on this phone. Telegram alerts use the defaults in your GitHub repo (docs/data/settings.json).</p>
    </form>`);
  $("#settings-form").addEventListener("submit", e => {
    e.preventDefault();
    const n = id => parseFloat($("#" + id).value);
    const fees = {}; for (const k of Object.keys(s.platforms)) fees[k] = (n("s-fee-" + k) || 0) / 100;
    S.overrides = { tax_rate: Math.min(0.9, (n("s-tax") || 0) / 100), min_profit_after_tax: n("s-minprofit") || 0, max_buy_ratio: (n("s-ratio") || 60) / 100,
      max_price_dkk: n("s-maxprice") || 7000, hours_per_item: n("s-hours") || 1, default_platform: $("#s-platform").value, ship_by_default: $("#s-ship").checked,
      costs: { transport: n("s-transport") || 0, cleaning: n("s-cleaning") || 0, packing: n("s-packing") || 0 }, fees };
    store.set("settings", S.overrides); closeSheet(); fillCalcControls(); setCalcRef($("#calc-ref").value); renderAll(); toast("Settings saved");
  });
  $("#s-reset").addEventListener("click", () => { S.overrides = {}; store.set("settings", {}); closeSheet(); fillCalcControls(); setCalcRef($("#calc-ref").value); renderAll(); toast("Back to defaults"); });
}

/* ------------------------------------------------------------------ sheet + tabs */
let lastFocus = null;
function openSheet(html) {
  lastFocus = document.activeElement;
  $("#sheet-root").innerHTML = `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  const first = $("#sheet-root [data-close], #sheet-root input, #sheet-root button"); first && first.focus({ preventScroll: true });
}
function closeSheet() { $("#sheet-root").innerHTML = ""; if (location.hash.startsWith("#deal-")) history.replaceState(null, "", location.pathname + location.search); lastFocus && lastFocus.focus?.(); }
function setTab(t) {
  $$(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  for (const v of ["deals", "calc", "stock", "stats"]) $("#view-" + v).hidden = v !== t;
  store.set("tab", t); window.scrollTo({ top: 0 });
}
function renderAll() { renderDeals(); renderCalc(); renderStock(); renderStats(); }

/* ------------------------------------------------------------------ data */
async function getJSON(path) { const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
function setStatus() {
  const u = S.deals.updated;
  $("#status").innerHTML = S.deals.sample ? "Example data" : u ? `Scanned<br>${ago(u)}` : "Not scanned yet";
}
async function loadData(manual = false) {
  try {
    const [st, rf, dl] = await Promise.all([getJSON("data/settings.json"), getJSON("data/refs.json"), getJSON("data/deals.json")]);
    S.base = st; S.refs = rf; S.deals = dl;
    if (manual) toast("Up to date");
  } catch { if (manual) toast("Offline. Showing the last data"); }
  setStatus(); fillCalcControls(); setCalcRef($("#calc-ref").value || "holm_floorvase"); renderAll(); routeHash();
}
function routeHash() {
  const m = location.hash.match(/^#deal-([a-z0-9]+)$/);
  if (m) { setTab("deals"); S.filter = "all"; renderDeals(); openDeal(m[1]); }
  else if (["#deals", "#calc", "#stock", "#stats"].includes(location.hash)) setTab(location.hash.slice(1));
}

/* ------------------------------------------------------------------ events */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a, [data-scrim]");
  if (!t) return;
  if (t.matches("[data-scrim]")) { if (e.target === t) closeSheet(); return; }
  if (t.matches(".tab")) return setTab(t.dataset.tab);
  if (t.dataset.filter) { S.filter = t.dataset.filter; return renderDeals(); }
  if (t.dataset.sort) { S.sortProfit = !S.sortProfit; return renderDeals(); }
  if (t.hasAttribute("data-show-all")) { S.filter = "all"; return renderDeals(); }
  if (t.dataset.deal) return openDeal(t.dataset.deal);
  if (t.hasAttribute("data-close")) return closeSheet();
  if (t.dataset.dealCalc) { const d = S.deals.items.find(x => x.id === t.dataset.dealCalc); closeSheet(); setTab("calc"); return calcFromDeal(d); }
  if (t.dataset.dealStock) {
    const d = S.deals.items.find(x => x.id === t.dataset.dealStock), s = settings(); closeSheet(); setTab("stock");
    return openItem({ name: d.title.slice(0, 80), ref_id: d.ref_id, bought_price: Math.round(d.price_dkk), costs: s.costs.transport + s.costs.cleaning + Math.round(d.extra_cost_dkk || 0) });
  }
  if (t.dataset.goto) return setTab(t.dataset.goto);
  if (t.hasAttribute("data-stock-new") || t.id === "stock-add") return openItem();
  if (t.hasAttribute("data-load-examples")) return loadExamples();
  if (t.hasAttribute("data-clear-examples")) { S.stock = S.stock.filter(i => !i.example); saveStock(); renderStock(); renderStats(); return toast("Examples cleared"); }
  if (t.hasAttribute("data-backup")) return openBackup();
  if (t.id === "open-settings") return openSettings();
  if (t.id === "refresh") return loadData(true);
  if (t.id === "calc-add") {
    const i = calcInputs(), s = settings(); setTab("stock");
    return openItem({ name: i.title || (i.ref ? i.ref.name : ""), ref_id: i.ref ? i.ref.id : null, bought_price: Math.round(i.asking), costs: i.transport + i.cleaning + i.extra, platform: i.platform });
  }
  if (t.dataset.act) {
    const card = t.closest("[data-item]"), it = S.stock.find(x => x.id === card.dataset.item);
    if (t.dataset.act === "edit") return openItem(it);
    if (t.dataset.act === "list") return openItem({ ...it, status: "listed" });
    if (t.dataset.act === "sell") return openItem({ ...it, status: "sold" });
    if (t.dataset.act === "del") {
      const row = t.closest(".btn-row");
      row.outerHTML = `<div class="confirm">Delete this item? <button class="btn small danger" data-act="del-yes">Delete</button><button class="btn small ghost" data-act="del-no">Keep</button></div>`;
      return;
    }
    if (t.dataset.act === "del-yes") { S.stock = S.stock.filter(x => x !== it); saveStock(); renderStock(); renderStats(); return toast("Deleted"); }
    if (t.dataset.act === "del-no") return renderStock();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet-root").innerHTML) closeSheet(); });
$("#calc-form").addEventListener("input", e => {
  if (e.target.id === "calc-title") {
    const m = matchRef(e.target.value), el = $("#calc-match");
    if (m.ref) { setCalcRef(m.ref.id); el.className = "match"; el.textContent = "Matched: " + m.ref.name; }
    else { el.className = "match none"; el.textContent = m.excluded ? `Looks like a copy or damaged item ("${m.excluded}"). Odyssey skips these.` : e.target.value ? "No match in your item list. Pick a type or enter a sale price." : "No item matched yet. Pick one below."; }
  }
  if (e.target.id === "calc-ref") setCalcRef(e.target.value);
  renderCalc();
});
$("#calc-form").addEventListener("change", renderCalc);
$("#calc-form").addEventListener("submit", e => e.preventDefault());
window.addEventListener("hashchange", routeHash);

/* ------------------------------------------------------------------ boot */
setTab(store.get("tab", "deals"));
setStatus(); fillCalcControls(); setCalcRef("holm_floorvase"); renderAll();
loadData();
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.hostname)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
